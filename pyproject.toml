[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundtrack"
version = "0.1.0"
description = "motus: oblique video -> top-down movement data (EPSG:27700) for architecture research"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
readme = "README.md"
dependencies = [
    "ultralytics>=8.4",
    "opencv-python>=4.9",
    "rasterio>=1.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "rhino3dm>=8.0",          # .3dm export for Rhino / Grasshopper
]
# PyTorch is installed separately so you get the right build for your machine (see README).

[project.optional-dependencies]
dev = ["pytest>=7", "pyogrio>=0.7", "ruff"]
app = ["pywebview>=5"]          # `motus app`: the desktop window (else it opens in the browser)
live = ["websockets>=14", "cryptography>=42", "qrcode>=7.4"]   # Live mode: the phone controller's hub
cloud = ["transformers>=4.45", "einops"]  # Live's point cloud (off by default): the depth model; einops for
# VGGT (the walk cloud), installed on its own with --no-deps: it asks for numpy<2 but runs on 2 (README)

[project.scripts]
motus = "groundtrack.cli:main"
groundtrack = "groundtrack.cli:main"      # the old name, still works

[tool.setuptools]
packages = ["groundtrack"]

[tool.setuptools.package-data]
groundtrack = ["ui.html", "desktop_web/*.*", "desktop_web/fonts/*", "desktop_web/live/*",
               "desktop_web/vendor/three/*", "desktop_web/vendor/three/addons/controls/*",
               "desktop_web/vendor/three/addons/lines/*", "live_phone/*", "live_phone/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end test that runs YOLO on a generated sample video (slower)"]
filterwarnings = ["ignore::PendingDeprecationWarning:rasterio"]
