<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>motus</title>
  <link rel="preload" href="/static/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/SplineSansMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='.5' y='.5' width='31' height='31' rx='7' fill='%230b0b0d' stroke='%233a3a40'/><g transform='translate(4 4) scale(.75)' fill='none' stroke='%23ededed' stroke-width='3' stroke-linecap='round'><circle cx='16' cy='19' r='8'/><path d='M3 6.5h26'/></g></svg>">
</head>
<body>
<div class="winctl" id="winctl" hidden>
  <button data-win="min" aria-label="Minimise" title="Minimise"><svg viewBox="0 0 12 12"><path d="M1.5 6h9" stroke="currentColor" stroke-width="1"/></svg></button>
  <button data-win="max" aria-label="Maximise" title="Maximise"><svg class="i-max" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg><svg class="i-restore" viewBox="0 0 12 12"><rect x="1.5" y="3.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/><path d="M3.5 1.5h7v7" fill="none" stroke="currentColor" stroke-width="1"/></svg></button>
  <button data-win="close" class="close" aria-label="Close" title="Close"><svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2 2 10" stroke="currentColor" stroke-width="1"/></svg></button>
</div>
<div class="edge top" data-edge="top" hidden></div><div class="edge tl" data-edge="topleft" hidden></div><div class="edge tr" data-edge="topright" hidden></div>
<div class="app" id="app">
  <header class="bar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="16" cy="19" r="8"/><path d="M3 6.5h26"/></svg>
      <span class="wordmark" aria-label="motus">mōtus</span>
      <span class="biz" id="project" title="Project folder"></span>
    </div>
    <div class="grow"></div>
    <button class="pill jobs-pill" id="jobs-pill" hidden></button>
    <div class="pill" id="device-pill" title="Where tracking runs"><i class="dot"></i><span>Checking GPU…</span></div>
    <button class="icon-btn" id="menu-btn" aria-haspopup="menu" aria-expanded="false" aria-label="More">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
    </button>
    <div class="menu" id="menu" role="menu" hidden>
      <button role="menuitem" data-menu="new-site">New site…</button>
      <button role="menuitem" data-menu="open-project">Open project folder</button>
      <button role="menuitem" data-menu="add-library">Add a library folder…</button>
      <button role="menuitem" data-menu="refresh">Refresh everything</button>
      <div class="status" id="menu-status"></div>
    </div>
  </header>

  <section class="hero" id="hero" aria-label="Site"></section>
  <nav class="steps" id="steps" aria-label="Workflow"></nav>

  <div class="cols" id="cols">
    <section class="panel sites" aria-labelledby="sites-title">
      <div class="panel-head">
        <h2 id="sites-title">Sites</h2><span class="n" id="sites-n"></span>
        <div class="grow"></div>
        <button class="btn sm" id="new-site" title="New site"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New</button>
      </div>
      <div class="search"><input id="site-search" placeholder="Find a site" autocomplete="off" spellcheck="false"></div>
      <div class="scroll"><ul class="list" id="sites"></ul></div>
    </section>

    <section class="panel work" id="work" aria-live="polite"></section>

    <section class="panel side" aria-label="Jobs, site and links">
      <div class="seg" role="tablist" id="tabs">
        <button role="tab" aria-selected="true" data-tab="jobs">Jobs<span class="n" id="n-jobs"></span></button>
        <button role="tab" aria-selected="false" data-tab="site">Site</button>
        <button role="tab" aria-selected="false" data-tab="links">Links</button>
      </div>
      <div class="pane" data-pane="jobs"><div class="scroll" id="jobs"></div></div>
      <div class="pane" data-pane="site" hidden><div class="scroll" id="site-pane"></div></div>
      <div class="pane" data-pane="links" hidden><div class="scroll" id="links-pane"></div></div>
    </section>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
  <div class="drawer-head">
    <div class="d-sub" id="drawer-title"></div>
    <div class="grow"></div>
    <button class="icon-btn" id="drawer-close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<div class="lightbox" id="lightbox" hidden>
  <div class="lb-top">
    <div class="lb-title" id="lb-title"></div>
    <div class="grow"></div>
    <button class="lb-btn" id="lb-folder">Show in folder</button>
    <button class="lb-btn icon" id="lb-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <button class="lb-nav prev" id="lb-prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
  <div class="lb-stage" id="lb-stage"></div>
  <button class="lb-nav next" id="lb-next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
</div>

<div class="modal-wrap" id="modal" hidden>
  <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modal-title">
    <h3 id="modal-title"></h3>
    <p id="modal-text"></p>
    <div class="btns"><button class="btn" id="modal-cancel">Cancel</button><button class="btn primary" id="modal-ok">OK</button></div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/static/viewer.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
